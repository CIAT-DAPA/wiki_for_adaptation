{# Floating AI chat widget. Included from base.html; talks to /chat/ask/. #}
<div id="ta-chat" data-endpoint="/chat/ask/" data-csrf="{{ csrf_token }}">
  <!-- Launcher button -->
  <button id="ta-chat-toggle" aria-label="Ask the wiki assistant"
          class="fixed bottom-5 right-5 z-[9999] flex items-center gap-2 rounded-full bg-brand-green px-4 py-3 text-white shadow-lg transition hover:brightness-110">
    <i class="fas fa-comment-dots"></i>
    <span class="hidden sm:inline text-sm font-medium">Ask the wiki</span>
  </button>

  <!-- Chat panel -->
  <div id="ta-chat-panel"
       class="fixed bottom-20 right-5 z-[9999] hidden w-[92vw] max-w-sm flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl"
       style="height: 32rem;">
    <div class="flex items-center justify-between bg-brand-green px-4 py-3 text-white">
      <div class="flex items-center gap-2">
        <i class="fas fa-robot"></i>
        <span class="font-semibold text-sm">Wiki Assistant</span>
      </div>
      <button id="ta-chat-close" aria-label="Close" class="text-white/90 hover:text-white">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div id="ta-chat-log" class="flex-1 space-y-3 overflow-y-auto px-4 py-4 text-sm bg-gray-50"></div>

    <form id="ta-chat-form" class="flex items-center gap-2 border-t border-gray-200 bg-white p-3">
      <input id="ta-chat-input" type="text" autocomplete="off"
             placeholder="Ask about indicators, metrics, methods…"
             class="flex-1 rounded-full border border-gray-300 px-4 py-2 text-sm focus:border-brand-green focus:outline-none" />
      <button type="submit" aria-label="Send"
              class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-green text-white hover:brightness-110">
        <i class="fas fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('ta-chat');
  if (!root) return;
  var endpoint = root.dataset.endpoint;
  var csrf = root.dataset.csrf;
  var toggle = document.getElementById('ta-chat-toggle');
  var panel = document.getElementById('ta-chat-panel');
  var closeBtn = document.getElementById('ta-chat-close');
  var form = document.getElementById('ta-chat-form');
  var input = document.getElementById('ta-chat-input');
  var log = document.getElementById('ta-chat-log');
  var greeted = false;

  function openPanel() {
    panel.classList.remove('hidden');
    panel.classList.add('flex');
    input.focus();
    if (!greeted) {
      greeted = true;
      addBot("Hi! Ask me anything about the adaptation indicators, metrics, methods or SOPs on this wiki.");
    }
  }
  function closePanel() {
    panel.classList.add('hidden');
    panel.classList.remove('flex');
  }
  toggle.addEventListener('click', function () {
    panel.classList.contains('hidden') ? openPanel() : closePanel();
  });
  closeBtn.addEventListener('click', closePanel);

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function addUser(text) {
    var el = document.createElement('div');
    el.className = 'flex justify-end';
    el.innerHTML = '<div class="max-w-[85%] rounded-2xl rounded-br-sm bg-brand-green px-3 py-2 text-white">' + esc(text) + '</div>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function addBot(text, sources) {
    var srcHtml = '';
    if (sources && sources.length) {
      srcHtml = '<div class="mt-2 border-t border-gray-200 pt-2 text-xs text-gray-500"><div class="mb-1 font-medium">Sources</div>';
      sources.forEach(function (s) {
        var label = esc(s.title);
        srcHtml += s.url
          ? '<a href="' + esc(s.url) + '" class="block text-brand-green hover:underline">' + label + '</a>'
          : '<span class="block">' + label + '</span>';
      });
      srcHtml += '</div>';
    }
    var el = document.createElement('div');
    el.className = 'flex justify-start';
    el.innerHTML = '<div class="max-w-[85%] rounded-2xl rounded-bl-sm bg-white border border-gray-200 px-3 py-2 text-gray-800">'
      + esc(text).replace(/\n/g, '<br>') + srcHtml + '</div>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addTyping() {
    var el = document.createElement('div');
    el.className = 'flex justify-start';
    el.id = 'ta-typing';
    el.innerHTML = '<div class="rounded-2xl rounded-bl-sm bg-white border border-gray-200 px-3 py-2 text-gray-400">…</div>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }
  function removeTyping() {
    var t = document.getElementById('ta-typing');
    if (t) t.remove();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    addUser(q);
    input.value = '';
    input.disabled = true;
    addTyping();

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
      body: JSON.stringify({ question: q })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        removeTyping();
        if (res.ok) {
          addBot(res.d.answer, res.d.sources);
        } else {
          addBot(res.d.error || 'Sorry, something went wrong.');
        }
      })
      .catch(function () {
        removeTyping();
        addBot('Sorry, I could not reach the assistant. Please try again.');
      })
      .finally(function () {
        input.disabled = false;
        input.focus();
      });
  });
})();
</script>
